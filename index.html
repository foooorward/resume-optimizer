  /* ---------- 优化结果 ---------- */
  function renderOptimizeResult() {
    var host = $('#optimizeResult');
    if (!host) return;
    var o = state.optimize;
    var btnApply = $('#btnApplyOptimize');
    if (btnApply) btnApply.disabled = !o;

    if (!o) {
      host.innerHTML = '<div class="result-block"><p class="muted">点上方「生成优化建议」，系统会对比岗位 JD 和你填写的信息，给出匹配度、简历体检清单和逐条改写建议。</p></div>';
      return;
    }

    var verdict, desc;
    if (o.noJd) { verdict = '还没解析岗位 JD'; desc = '没有 JD 就算不出岗位匹配度。回到第一步粘贴岗位描述并解析，才知道简历该往哪个方向改。'; }
    else if (o.score >= 85) { verdict = '高度匹配，可以放心投递'; desc = '关键词覆盖充分，成果也够量化，保持这个版本直接投。'; }
    else if (o.score >= 70) { verdict = '匹配良好，补几个词更稳'; desc = '整体对口，把下方缺失关键词中你确实会的补进经历描述，命中率还能再提一档。'; }
    else if (o.score >= 50) { verdict = '基本匹配，建议按提示优化'; desc = '岗位方向对口，但关键词和量化成果还有明显缺口，建议先做一轮改写再投。'; }
    else { verdict = '匹配偏低，先补齐再投'; desc = '当前简历与这份 JD 的重合度不高，优先按体检清单逐条补齐，或考虑换个更对口的岗位。'; }

    var ring = '<div class="score-wrap">' +
      '<div class="ring">' + ringSvg(o.noJd ? 0 : o.score, 128) + '<div class="ring-in"><span class="ring-num" style="color:' + (o.noJd ? '#98a1b2' : scoreColor(o.score)) + '">' + (o.noJd ? '—' : o.score) + '</span><span class="ring-lbl">岗位匹配度</span></div></div>' +
      '<div class="score-side"><div class="verdict">' + esc(verdict) + '</div><div class="desc">' + esc(desc) + '</div>' +
      '<div class="legend"><span>关键词覆盖 ' + o.kwScore + '%</span><span>成果量化 ' + o.quantScore + '%</span><span>信息完整度 ' + o.compScore + '%</span></div>' +
      '</div></div>';

    var missHtml = '';
    if (o.missing.length) {
      missHtml = '<div class="result-block"><div class="kw-title">' + icon('alert', 14) + ' 缺失关键词（点击可复制）</div><div class="kw-list">' +
        o.missing.map(function (k) { return '<span class="kw miss" data-copykw="' + esc(k.word) + '" style="cursor:pointer">' + esc(k.word) + '<span class="kw-n">' + esc(k.cat) + '</span></span>'; }).join('') +
        '</div><p class="muted" style="margin-top:8px">建议做法：逐条自问「我真的做过吗」。做过 → 把该词自然写进对应的工作/项目描述里；没做过 → 不要硬写，改投更匹配的岗位。</p></div>';
    } else {
      missHtml = '<div class="result-block"><div class="kw-title">' + icon('check', 14) + ' 关键词</div><p class="muted">JD 里的关键词你基本都覆盖到了。</p></div>';
    }

    var checkHtml = '<div class="result-block"><div class="kw-title">' + icon('doc', 14) + ' 简历体检清单</div>' +
      o.checks.map(function (c) {
        var ico = c.level === 'good' ? 'check' : c.level === 'warn' ? 'warn' : 'alert';
        return '<div class="check-item ' + c.level + '">' +
          '<span class="ci-ico">' + icon(ico, 15) + '</span>' +
          '<div style="min-width:0"><div class="ci-t">' + esc(c.title) + '</div><div class="ci-d">' + esc(c.detail) + '</div>' +
          (c.action ? '<div class="ci-a">' + esc(c.action) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>';

    var sumHtml = '<div class="result-block"><div class="kw-title">' + icon('spark', 14) + ' 自我评价 · 重写版</div>' +
      '<div class="rw"><div class="rw-box new"><span class="rw-tag">建议版本</span>' + esc(o.rewrittenSummary) + '</div></div>' +
      '<div class="rw"><div class="rw-box old"><span class="rw-tag">你当前填写</span>' + esc((state.profile && state.profile.summary) || '（空）') + '</div></div></div>';

    var rwHtml = '';
    if (o.rewrites.length) {
      rwHtml = '<div class="result-block"><div class="kw-title">' + icon('edit', 14) + ' 经历逐条改写</div>' +
        o.rewrites.map(function (r) {
          var oldHtml = r.original.split('\n').map(function (s) { return esc(s); }).join('<br>');
          var newHtml = r.improved.map(function (s, si) {
            var mark = (r.flags && r.flags[si]) ? ' <span style="color:#d97706;font-size:11.5px;white-space:nowrap">[建议补量化]</span>' : '';
            return esc(s) + mark;
          }).join('<br>');
          var noteHtml = r.notes.map(function (n) { return '<div class="rw-note">' + icon('warn', 12) + ' ' + esc(n) + '</div>'; }).join('');
          return '<div class="rw"><div class="rw-head">' + icon('brief', 14) + ' ' + esc(r.label) + '</div>' +
            '<div class="rw-row">' +
            '<div class="rw-box old"><span class="rw-tag">原始</span>' + oldHtml + '</div>' +
            '<div class="rw-box new"><span class="rw-tag">改写</span>' + newHtml + '</div>' +
            '</div>' + noteHtml + '</div>';
        }).join('') + '</div>';
    }

    var skillHtml = '<div class="result-block"><div class="kw-title">' + icon('check', 14) + ' 技能栏 · 推荐排序</div><div class="kw-list">' +
      o.orderedSkills.map(function (s) { return '<span class="kw">' + esc(s) + '</span>'; }).join('') + '</div>' +
      '<p class="muted" style="margin-top:8px">命中的岗位关键词排在前面，ATS 系统与 HR 一眼就能扫到。</p></div>';

    host.innerHTML = '<div class="result-block" style="border-top:none;padding-top:14px">' + ring + '</div>' +
      missHtml + checkHtml + sumHtml + rwHtml + skillHtml;
  }

  /* ============================================================
     预览 / 视图 / 导航 / 事件 / 初始化
     ============================================================ */

  function renderView() {
    var desk = $('#viewDesk'), build = $('#viewBuild');
    if (desk) desk.className = 'view' + (state.view === 'desk' ? '' : ' is-hidden');
    if (build) build.className = 'view' + (state.view === 'build' ? '' : ' is-hidden');
    $$('.tab').forEach(function (t) {
      t.className = 'tab' + (t.getAttribute('data-view') === state.view ? ' is-active' : '');
    });
  }

  function renderStepper() {
    $$('.step').forEach(function (b) {
      var n = parseInt(b.getAttribute('data-step'), 10);
      b.className = 'step' + (n === state.step ? ' is-active' : (n < state.step ? ' is-done' : ''));
    });
    for (var i = 1; i <= 4; i++) {
      var p = document.getElementById('panel' + i);
      if (p) p.className = 'card step-panel' + (i === state.step ? '' : ' is-hidden');
    }
    var prev = $('#btnPrevStep'), next = $('#btnNextStep');
    if (prev) prev.style.visibility = state.step === 1 ? 'hidden' : 'visible';
    if (next) {
      next.innerHTML = state.step === 4 ? (icon('check', 15) + ' 回到工作台') : ('下一步 ' + icon('arrow', 15));
    }
  }

  function renderPreview() {
    var host = $('#resumePaper');
    if (!host) return;
    var p = state.profile || emptyProfile();
    var jd = state.jdParsed || {};
    var target = readField('jdTitle') || jd.title || String(p.intention || '').split(/[·\/|，,]/)[0] || '';

    if (!p.name && !(p.works && p.works[0] && p.works[0].company)) {
      host.innerHTML = '<div class="empty"><strong>还没有可预览的内容</strong>先去第二步填写个人信息，这里会实时生成简历排版。</div>';
      return;
    }

    var contacts = [p.phone, p.email, p.city].filter(Boolean);
    var html = '<div class="rp-head">' +
      '<div class="rp-name">' + esc(p.name || '（姓名）') + '</div>' +
      (contacts.length ? '<div class="rp-contact">' + contacts.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>' : '') +
      (target ? '<div class="rp-intent">求职意向：' + esc(target) + '</div>' : '') +
      '</div>';

    var kwWords = (jd.keywords || []).map(function (k) { return k.word; });
    var summaryText = String(p.summary || '').trim();
    if (summaryText) {
      html += '<div class="rp-sec"><div class="rp-sec-t">个人优势</div><p>' + highlightKeywords(summaryText, kwWords) + '</p></div>';
    }

    var skillList = cleanSkillList(String(p.skills || '').split(/[，,、;；\n]+/));
    if (skillList.length) {
      html += '<div class="rp-sec"><div class="rp-sec-t">核心技能</div><div class="rp-skills">' +
        skillList.map(function (s) { return '<span class="rp-sk">' + esc(s) + '</span>'; }).join('') + '</div></div>';
    }

    var works = (p.works || []).filter(function (w) { return w.company || w.title || w.desc; });
    if (works.length) {
      html += '<div class="rp-sec"><div class="rp-sec-t">工作经历</div>';
      works.forEach(function (w) {
        html += '<div class="rp-item">' +
          '<div class="rp-item-top"><span class="l">' + esc(w.company || '') + (w.title ? ' · ' + esc(w.title) : '') + '</span>' +
          '<span class="r">' + esc(w.period || '') + '</span></div>';
        var bl = splitBullets(w.desc);
        if (bl.length) html += '<ul class="rp-ul">' + bl.map(function (b) { return '<li>' + highlightKeywords(b, kwWords) + '</li>'; }).join('') + '</ul>';
        html += '</div>';
      });
      html += '</div>';
    }

    var projs = (p.projects || []).filter(function (x) { return x.name || x.role || x.desc; });
    if (projs.length) {
      html += '<div class="rp-sec"><div class="rp-sec-t">项目经历</div>';
      projs.forEach(function (x) {
        html += '<div class="rp-item">' +
          '<div class="rp-item-top"><span class="l">' + esc(x.name || '') + (x.role ? ' · ' + esc(x.role) : '') + '</span>' +
          '<span class="r">' + esc(x.period || '') + '</span></div>';
        var bl = splitBullets(x.desc);
        if (bl.length) html += '<ul class="rp-ul">' + bl.map(function (b) { return '<li>' + highlightKeywords(b, kwWords) + '</li>'; }).join('') + '</ul>';
        html += '</div>';
      });
      html += '</div>';
    }

    if (p.school || p.degree || p.major) {
      html += '<div class="rp-sec"><div class="rp-sec-t">教育背景</div>' +
        '<div class="rp-item"><div class="rp-item-top"><span class="l">' + esc(p.school || '') + (p.major ? ' · ' + esc(p.major) : '') + '</span>' +
        '<span class="r">' + esc(p.degree || '') + (p.gradYear ? ' · ' + esc(p.gradYear) + ' 年毕业' : '') + '</span></div></div></div>';
    }

    var certs = String(p.certs || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    if (certs.length) {
      html += '<div class="rp-sec"><div class="rp-sec-t">证书与荣誉</div><ul class="rp-ul">' +
        certs.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>';
    }

    host.innerHTML = html;
  }

  function highlightKeywords(text, words) {
    var out = esc(text);
    if (!words || !words.length) return out;
    var used = {};
    for (var i = 0; i < words.length; i++) {
      var w = String(words[i] || '');
      if (w.length < 2 || used[w]) continue;
      if (out.indexOf(esc(w)) === -1) continue;
      used[w] = 1;
      out = out.split(esc(w)).join('<strong style="color:#1f52c8;font-weight:650">' + esc(w) + '</strong>');
      if (Object.keys(used).length >= 8) break;
    }
    return out;
  }

  /* ---------- 交互动作 ---------- */
  function goStep(n) { state.step = clamp(n, 1, 4); renderStepper(); }
  function goView(v) { state.view = v; renderView(); }

  function parseJdNow() {
    var ta = $('#jdInput');
    state.jd = ta ? ta.value : '';
    if (!String(state.jd).trim()) { toast('请先粘贴岗位 JD'); return; }
    state.jdParsed = parseJD(state.jd);
    if (state.jdParsed.title && !readField('jdTitle')) setValue('jdTitle', state.jdParsed.title);
    if (state.jdParsed.company && !readField('jdCompany')) setValue('jdCompany', state.jdParsed.company);
    if (!readField('jdResumeName')) {
      setValue('jdResumeName', [state.jdParsed.title || '简历', state.jdParsed.company].filter(Boolean).join('-'));
    }
    state.sampleDraft = false;
    state.optimize = null;
    syncProfileFromForm();
    saveDraftLocal();
    refreshAll();
    toast('已识别 ' + state.jdParsed.keywords.length + ' 个岗位关键词');
    if (state.step === 1) { state.step = 2; renderStepper(); }
  }

  function runOptimizeNow() {
    var p = syncProfileFromForm();
    if (!state.jdParsed) {
      state.jd = $('#jdInput') ? $('#jdInput').value : state.jd;
      if (String(state.jd || '').trim()) state.jdParsed = parseJD(state.jd);
    }
    if (!p.name && !p.works[0] && !p.skills) { toast('先填写个人信息，优化结果才有依据'); return; }
    state.optimize = buildOptimize(p, state.jdParsed);
    refreshAll();
    toast('匹配度 ' + state.optimize.score + ' 分，共 ' + state.optimize.checks.length + ' 条体检结论');
  }

  function findResume(id) {
    var list = allResumes();
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return list[i]; }
    return null;
  }

  function openResume(id) {
    var r = findResume(id);
    if (!r) return;
    state.currentId = r.sample ? null : r.id;
    var ta = $('#jdInput');
    if (r.jd) { if (ta) ta.value = r.jd; state.jd = r.jd; state.jdParsed = parseJD(r.jd); }
    else { if (ta) ta.value = ''; state.jd = ''; state.jdParsed = null; }
    setValue('jdResumeName', r.name);
    setValue('jdTitle', r.title);
    setValue('jdCompany', r.company);
    var p = r.profile || emptyProfile();
    writeProfileToForm(p);
    state.optimize = buildOptimize(p, state.jdParsed);
    var sel = $('#resumeStatus');
    if (sel) sel.value = statusIdOf(r.status);
    state.sampleDraft = false;
    state.view = 'build';
    state.step = 4;
    refreshAll();
    toast(r.sample ? '已载入示例简历，可直接修改成你自己的内容' : '已打开「' + r.name + '」');
  }

  function duplicateResume(id) {
    var r = findResume(id);
    if (!r) return;
    state.currentId = null;
    var ta = $('#jdInput');
    if (r.jd) { if (ta) ta.value = r.jd; state.jd = r.jd; state.jdParsed = parseJD(r.jd); }
    setValue('jdResumeName', r.name + ' 副本');
    setValue('jdTitle', r.title);
    setValue('jdCompany', r.company);
    var p = r.profile ? JSON.parse(JSON.stringify(r.profile)) : emptyProfile();
    writeProfileToForm(p);
    state.optimize = buildOptimize(p, state.jdParsed);
    var sel = $('#resumeStatus');
    if (sel) sel.value = statusIdOf('草稿');
    state.view = 'build'; state.step = 2;
    refreshAll();
    toast('已复制为新简历，改完记得保存');
  }

  function clearSampleData() {
    confirmDialog('清空示例数据', '将移除工作台里的 3 份示例简历（不影响你自己保存的简历）。确定继续吗？', '清空示例', function () {
      state.samples = [];
      lsSet(LS_SAMPLE, []);
      refreshAll();
      toast('示例数据已清空');
    });
  }

  function deleteResume(id) {
    var r = findResume(id);
    if (!r) return;
    confirmDialog('删除简历', '「' + r.name + '」将被永久删除，无法恢复。确定删除吗？', '删除', function () {
      if (r.sample) {
        state.samples = (state.samples || []).filter(function (x) { return x.id !== id; });
        lsSet(LS_SAMPLE, state.samples);
        refreshAll();
        toast('示例已删除');
        return;
      }
      if (!db) {
        state.resumes = state.resumes.filter(function (x) { return x.id !== id; });
        cacheResumes();
        refreshAll();
        toast('已从本地删除');
        return;
      }
      setSync('busy', '同步中…');
      removeRecord(id).then(function () {
        state.resumes = state.resumes.filter(function (x) { return x.id !== id; });
        cacheResumes();
        refreshAll();
        toast('已删除');
      }).catch(function (err) {
        console.error('[database] 删除失败:', err);
        toast('删除失败，请稍后重试');
      }).then(function () { setSync(db ? 'ok' : 'off', db ? '已同步' : MODE_LABEL); });
    });
  }

  function markSent(id) {
    var r = findResume(id);
    if (!r) return;
    if (r.sample) {
      r.status = '已投递'; r.updatedAt = nowIso();
      lsSet(LS_SAMPLE, state.samples);
      refreshAll();
      toast('已标记为已投递');
      return;
    }
    if (!db) {
      r.status = '已投递'; r.updatedAt = nowIso();
      cacheResumes(); refreshAll(); toast(MODE_LABEL + '：已本地更新');
      return;
    }
    setSync('busy', '同步中…');
    writeRecord({
      name: r.name, title: r.title, company: r.company, jd: r.jd, score: r.score,
      profileRaw: r.profileRaw, optimized: r.optimized, status: '已投递'
    }, r.id).then(function () {
      return loadRecordsAsync();
    }).then(function () {
      toast('已标记为已投递');
    }).catch(function (err) {
      console.error('[database] 更新失败:', err);
      toast('更新失败，请稍后重试');
      setSync('off', MODE_LABEL);
    });
  }

  function loadRecordsAsync() {
    return new Promise(function (resolve) {
      if (!db) { resolve(); return; }
      loadRecords();
      resolve();
    });
  }

  function newResume() {
    confirmDialog('新建简历', '当前编辑区的未保存内容会被清空（已保存的简历不受影响）。继续吗？', '新建', function () {
      clearAllForm();
      state.currentId = null;
      state.sampleDraft = false;
      state.view = 'build';
      state.step = 1;
      refreshAll();
      toast('已新建空白简历，先去粘贴岗位 JD');
    });
  }

  function saveCurrentResume() {
    var p = syncProfileFromForm();
    var jdText = $('#jdInput') ? $('#jdInput').value : '';
    if (!jdText.trim() && !p.name) { toast('内容太少，先填写岗位 JD 或个人信息'); return; }
    var jd = state.jdParsed;
    if (!jd && jdText.trim()) { jd = parseJD(jdText); state.jdParsed = jd; }
    var o = state.optimize || buildOptimize(p, jd);
    state.optimize = o;

    var name = readField('jdResumeName') || [((jd && jd.title) || '简历'), p.name].filter(Boolean).join('-');
    var title = readField('jdTitle') || ((jd && jd.title) || '');
    var company = readField('jdCompany') || ((jd && jd.company) || '');
    var sel = $('#resumeStatus');
    var statusText = sel && sel.value ? statusTextOf(sel.value) : '草稿';

    var payload = {
      name: name, title: title, company: company, jd: jdText,
      score: o.score, profileRaw: JSON.stringify(p), optimized: o.plain, status: statusText
    };

    if (!db) {
      var localId = state.currentId || ('local-' + uid());
      var rec = {
        id: localId, sample: false, name: name, title: title, company: company, jd: jdText,
        score: o.score, profile: p, profileRaw: payload.profileRaw, optimized: o.plain,
        status: statusText, updatedAt: nowIso()
      };
      var found = false;
      state.resumes = state.resumes.map(function (x) {
        if (x.id === localId) { found = true; return rec; }
        return x;
      });
      if (!found) state.resumes.unshift(rec);
      state.currentId = localId;
      cacheResumes();
      state.sampleDraft = false;
      refreshAll();
      toast(MODE_LABEL + '：已保存到浏览器本地');
      return;
    }

    setSync('busy', '同步中…');
    var btn = $('#btnSaveDb');
    if (btn) { btn.disabled = true; }
    writeRecord(payload, state.currentId).then(function (res) {
      var newId = res && (res.id || res.recordId) ? (res.id || res.recordId) : state.currentId;
      if (!state.currentId && newId) state.currentId = String(newId);
      state.sampleDraft = false;
      loadRecords();
      toast('已保存到工作台，多设备自动同步');
    }).catch(function (err) {
      console.error('[database] 保存失败:', err);
      setSync('off', MODE_LABEL);
      toast('保存失败，已暂存到本地缓存');
      cacheResumes();
    }).then(function () {
      if (btn) { btn.disabled = false; }
      setSync(db ? 'ok' : 'off', db ? '已同步' : MODE_LABEL);
    });
  }

  /* ---------- 导出 / 导入 ---------- */
  function exportJson() {
    var data = {
      type: 'resume-workspace-backup', version: 1, exportedAt: nowIso(),
      resumes: state.resumes.concat(state.samples || [])
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '简历工作台备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast('已导出 ' + data.resumes.length + ' 份简历');
  }

  function importJson(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try { data = JSON.parse(String(reader.result)); } catch (e) { toast('文件格式不正确，导入失败'); return; }
      var rows = data && data.resumes ? data.resumes : (Array.isArray(data) ? data : []);
      if (!rows.length) { toast('文件里没有可导入的简历'); return; }
      var added = 0;
      var localOnly = rows.map(function (row) {
        var p = row.profile || null;
        if (!p && row.profileRaw) { try { p = JSON.parse(row.profileRaw); } catch (e) { p = null; } }
        return {
          id: 'local-' + uid(), sample: false,
          name: row.name || '未命名简历', title: row.title || '', company: row.company || '',
          jd: row.jd || '', score: num(row.score), profile: p,
          profileRaw: row.profileRaw || (p ? JSON.stringify(p) : ''),
          optimized: row.optimized || '', status: row.status || '草稿',
          updatedAt: row.updatedAt || nowIso()
        };
      });
      localOnly.forEach(function (r) { state.resumes.unshift(r); added++; });
      cacheResumes();
      refreshAll();
      toast('已导入 ' + added + ' 份简历');

      if (db) {
        var i = 0;
        (function uploadNext() {
          if (i >= localOnly.length) { loadRecords(); toast('已同步 ' + localOnly.length + ' 份到云端'); return; }
          var r = localOnly[i++];
          writeRecord({
            name: r.name, title: r.title, company: r.company, jd: r.jd, score: r.score,
            profileRaw: r.profileRaw, optimized: r.optimized, status: r.status
          }, null).then(uploadNext).catch(function (err) {
            console.error('[database] 导入同步失败:', err);
            toast('部分简历只保存在本地');
          });
        })();
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  function copyText(text, okMsg) {
    if (!text) { toast('没有可复制的内容'); return; }
    var ok = function () { toast(okMsg); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () { fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  }
  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { toast('复制失败，请手动选中文本复制'); }
    document.body.removeChild(ta);
  }

  function currentPlainText() {
    var p = syncProfileFromForm();
    var o = state.optimize;
    return o ? o.plain : buildResumeText(p, state.jdParsed, {
      summary: String(p.summary || '').trim(), skills: cleanSkillList(String(p.skills || '').split(/[，,、;；]+/)),
      rewrites: [], missing: []
    }).plain;
  }
  function currentMarkdown() {
    var p = syncProfileFromForm();
    var o = state.optimize;
    return o ? o.markdown : buildResumeText(p, state.jdParsed, {
      summary: String(p.summary || '').trim(), skills: cleanSkillList(String(p.skills || '').split(/[，,、;；]+/)),
      rewrites: [], missing: []
    }).markdown;
  }

  function printResume() {
    state.view = 'build';
    state.step = 4;
    refreshAll();
    setTimeout(function () { window.print(); }, 150);
  }

  /* ---------- 弹窗 ---------- */
  function confirmDialog(title, msg, okLabel, onOk) {
    var mask = document.createElement('div');
    mask.className = 'mask';
    mask.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p>' +
      '<div class="modal-actions"><button class="btn ghost" data-x="0">取消</button>' +
      '<button class="btn primary" data-x="1">' + esc(okLabel || '确定') + '</button></div></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function (e) {
      var node = e.target;
      var x = null;
      while (node && node !== mask) {
        if (node.getAttribute && node.getAttribute('data-x')) { x = node.getAttribute('data-x'); break; }
        node = node.parentNode;
      }
      if (x === null && e.target !== mask) return;
      document.body.removeChild(mask);
      if (x === '1') onOk();
    });
  }

  /* ---------- 事件绑定 ---------- */
  var previewTimer = null;
  function schedulePreview() {
    if (previewTimer) clearTimeout(previewTimer);
    previewTimer = setTimeout(function () { renderPreview(); }, 300);
  }

  function bindEvents() {
    $$('.tab').forEach(function (t) {
      t.addEventListener('click', function () {
        state.view = t.getAttribute('data-view');
        refreshAll();
      });
    });
    $$('.step').forEach(function (b) {
      b.addEventListener('click', function () { goStep(parseInt(b.getAttribute('data-step'), 10)); });
    });
    on('#btnPrevStep', 'click', function () { if (state.step > 1) goStep(state.step - 1); });
    on('#btnNextStep', 'click', function () {
      if (state.step < 4) goStep(state.step + 1);
      else { state.view = 'desk'; state.step = 4; refreshAll(); }
    });
    on('#btnParseJd', 'click', parseJdNow);
    on('#btnJdSample', 'click', function () {
      var ta = $('#jdInput');
      if (ta) ta.value = SAMPLE_JD;
      state.sampleDraft = false;
      parseJdNow();
    });
    on('#btnJdClear', 'click', function () {
      var ta = $('#jdInput');
      if (ta) ta.value = '';
      state.jd = ''; state.jdParsed = null; state.optimize = null;
      setValue('jdResumeName', ''); setValue('jdTitle', ''); setValue('jdCompany', '');
      refreshAll();
    });
    on('#jdInput', 'input', function () {
      state.jd = $('#jdInput').value;
      state.sampleDraft = false;
      saveDraftLocal();
    });
    on('#btnProfileSample', 'click', function () {
      writeProfileToForm(sampleProfile());
      state.optimize = null;
      state.sampleDraft = false;
      refreshAll();
      toast('已填入示例个人信息');
    });
    on('#btnAddWork', 'click', addWork);
    on('#btnAddProject', 'click', addProject);

    on('#workList', 'click', function (e) {
      var idx = attrUp(e.target, 'data-act'), i = attrUp(e.target, 'data-idx');
      if (idx === 'del-work') removeWork(parseInt(i, 10));
    });
    on('#projectList', 'click', function (e) {
      var act = attrUp(e.target, 'data-act'), i = attrUp(e.target, 'data-idx');
      if (act === 'del-project') removeProject(parseInt(i, 10));
    });

    on('#panel2', 'input', function () { saveDraftLocal(); schedulePreview(); });
    on('#panel2', 'change', function () { saveDraftLocal(); schedulePreview(); });

    on('#btnOptimize', 'click', runOptimizeNow);
    on('#btnApplyOptimize', 'click', function () {
      confirmDialog('应用优化建议', '将用改写版本覆盖你的自我评价、技能栏和经历描述（原内容会被替换）。确定应用吗？', '应用', function () {
        applyOptimization();
      });
    });
    on('#optimizeResult', 'click', function (e) {
      var w = attrUp(e.target, 'data-copykw');
      if (w) copyText(w, '已复制关键词「' + w + '」');
    });

    on('#btnSaveDb', 'click', saveCurrentResume);
    on('#btnPrint', 'click', printResume);
    on('#btnCopyMd', 'click', function () { copyText(currentMarkdown(), 'Markdown 已复制到剪贴板'); });
    on('#btnCopyText', 'click', function () { copyText(currentPlainText(), '纯文本已复制到剪贴板'); });

    on('#btnExportJson', 'click', exportJson);
    on('#btnImportJson', 'click', function () { var f = $('#fileImport'); if (f) f.click(); });
    on('#fileImport', 'change', function () {
      var f = $('#fileImport');
      if (f && f.files && f.files[0]) importJson(f.files[0]);
      if (f) f.value = '';
    });

    on('#btnNewResume', 'click', newResume);
    on('#btnClearSample', 'click', clearSampleData);

    on('#resumeGrid', 'click', function (e) {
      var o = attrUp(e.target, 'data-open'), d = attrUp(e.target, 'data-dup'), x = attrUp(e.target, 'data-del');
      if (o) openResume(o);
      else if (d) duplicateResume(d);
      else if (x) deleteResume(x);
    });
    on('#todoList', 'click', function (e) {
      var act = attrUp(e.target, 'data-todo'), id = attrUp(e.target, 'data-id');
      if (!act || !id) return;
      if (act === 'mark') markSent(id);
      else openResume(id);
    });
  }

  function on(sel, evt, fn) {
    var el = $(sel);
    if (el) el.addEventListener(evt, fn);
  }
  function attrUp(node, attr) {
    while (node && node.getAttribute) {
      var v = node.getAttribute(attr);
      if (v) return v;
      node = node.parentNode;
    }
    return null;
  }

  /* ---------- 初始化 ---------- */
  var backupHinted = false;

  function init() {
    state.profile = emptyProfile();

    state.samples = lsGet(LS_SAMPLE);
    if (state.samples === null) {
      state.samples = buildSamples();
      lsSet(LS_SAMPLE, state.samples);
    }
    if (state.samples.length) {
      state.resumes = [];
    }

    renderWorkList();
    renderProjectList();

    var restored = restoreDraftLocal();
    if (!restored) {
      writeProfileToForm(sampleProfile());
      var ta = $('#jdInput');
      if (ta) ta.value = SAMPLE_JD;
      state.jd = SAMPLE_JD;
      state.jdParsed = parseJD(SAMPLE_JD);
      state.sampleDraft = true;
      setValue('jdResumeName', '产品经理-星辰科技');
      setValue('jdTitle', state.jdParsed.title);
      setValue('jdCompany', state.jdParsed.company);
    } else {
      syncProfileFromForm();
      if (!state.jdParsed && state.jd) state.jdParsed = parseJD(state.jd);
      state.sampleDraft = false;
    }
    state.optimize = buildOptimize(state.profile, state.jdParsed);

    bindEvents();
    renderView();
    refreshAll();

    initSync();
    loadSchema().then(function () { loadRecords(); });

    setTimeout(function () {
      if (state.sampleDraft) toast('已预填示例 JD 与示例信息，点「清空」可从头开始');
    }, 700);
  }

  function afterLoadBackupHint() {
    if (backupHinted) return;
    if (state.resumes.length >= 30) {
      backupHinted = true;
      setTimeout(function () { toast('数据已积累 ' + state.resumes.length + ' 条，建议点右上角「导出备份」存一份'); }, 1200);
    }
  }

  init();
  setTimeout(afterLoadBackupHint, 2000);



})();
</script>
</body>
</html>
